
<div id="support-chat">
    <h2>VDF Games Support</h2>

    <div id="chat-messages">
        <div class="bot-message">
            Dobrý den! Jak vám mohu pomoci?
        </div>
    </div>

    <div class="chat-input">
        <input
            type="text"
            id="user-message"
            placeholder="Napište svůj dotaz..."
        >

        <button onclick="sendMessage()">
            Odeslat
        </button>
    </div>
</div>

<style>
#support-chat {
    max-width: 450px;
    margin: 30px auto;
    padding: 20px;
    background: #181818;
    color: white;
    border-radius: 12px;
    font-family: Arial, sans-serif;
}

#chat-messages {
    height: 350px;
    overflow-y: auto;
    padding: 10px;
    background: #242424;
    border-radius: 8px;
    margin-bottom: 15px;
}

.bot-message, .user-message {
    padding: 12px;
    margin: 8px 0;
    border-radius: 8px;
    max-width: 85%;
    white-space: pre-wrap;
}

.bot-message {
    background: #343434;
}

.user-message {
    background: #2456a6;
    margin-left: auto;
}

.chat-input {
    display: flex;
    gap: 8px;
}

.chat-input input {
    flex: 1;
    min-width: 0;
    padding: 12px;
    border-radius: 6px;
    border: none;
}

.chat-input button {
    padding: 12px;
    background: #2463eb;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}
</style>

<script>
const API_URL = "https://TVUJ-SERVER.onrender.com/api/chat";

async function sendMessage() {
    const input = document.getElementById("user-message");
    const messages = document.getElementById("chat-messages");

    const message = input.value.trim();

    if (!message) return;

    addMessage(message, "user-message");
    input.value = "";

    const loading = addMessage(
        "Podpora připravuje odpověď...",
        "bot-message"
    );

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message
            })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.error || "Chyba serveru");
        }

        loading.textContent = data.response;

    } catch (error) {
        loading.textContent =
            "Omlouváme se, momentálně se nepodařilo spojit s podporou.";
        console.error(error);
    }
    
    messages.scrollTop = messages.scrollHeight;
}

function addMessage(text, className) {
    const messages = document.getElementById("chat-messages");

    const element = document.createElement("div");
    element.className = className;
    element.textContent = text;

    messages.appendChild(element);
    messages.scrollTop = messages.scrollHeight;

    return element;
}

document.getElementById("user-message")
    .addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    });
</script>
