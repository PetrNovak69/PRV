<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GetGames - Podpora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="support-container">

        <header>
            <h1>GetGames</h1>
            <p>Centrum zákaznické podpory</p>
        </header>

        <main>
            <section class="question-box">
                <h2>Napište nám</h2>
                <p>Vyplňte svůj e-mail a popište svůj problém nebo dotaz.</p>

                <input 
                    type="email" 
                    id="email" 
                    placeholder="Váš e-mail"
                >

                <textarea 
                    id="question" 
                    placeholder="Napište svůj dotaz..."
                ></textarea>

                <button onclick="sendQuestion()">Odeslat dotaz</button>
            </section>

            <section class="answer-box">
                <h2>Odpověď podpory</h2>

                <div id="answer">
                    Zde se zobrazí odpověď zákaznické podpory.
                </div>
            </section>
        </main>

        <footer>
            © 2026 GetGames · Zákaznická podpora
        </footer>

    </div>

    <script>
        // Přepínač: zatím bez backendu
const USE_BACKEND = true;

// TADY si každý student nastaví svoje údaje (až bude backend):
const BACKEND_URL = "https://vdf-games-kostak-2026.onrender.com/chat";
const STUDENT_ID = "Kostak_Ladislav_4ITE";

const form = document.getElementById("question-form");
const textarea = document.getElementById("question");
const emailInput = document.getElementById("email");
const answerDiv = document.getElementById("answer");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const text = textarea.value.trim();
  const email = emailInput.value.trim();

  if (!text) {
    answerDiv.textContent = "Nejdřív napiš dotaz.";
    return;
  }

  // vždy ukážeme "loading"
  answerDiv.textContent = "Zpracovávám dotaz…";
  form.querySelector("button").disabled = true;

  try {
    const payload = {
      message: text,
      student: STUDENT_ID,
      email: email || null
    };

    // --- FAKE MODE (bez backendu) ---
    if (!USE_BACKEND) {
      answerDiv.textContent =
        `Demo odpověď (bez serveru)\n\n` +
        `Student: ${payload.student}\n` +
        `Dotaz: ${payload.message}`;
      return;
    }

    // --- REAL MODE (s backendem) ---
    const res = await fetch(BACKEND_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      answerDiv.textContent = "Server vrátil chybu: " + res.status;
      return;
    }

    const data = await res.json();

    if (data.reply) {
      answerDiv.textContent = data.reply;
    } else if (data.error) {
      answerDiv.textContent = "Chyba serveru: " + data.error;
    } else {
      answerDiv.textContent = "Server nevrátil žádnou odpověď.";
    }
  } catch (err) {
    console.error(err);
    answerDiv.textContent = "Nepodařilo se spojit se serverem.";
  } finally {
    form.querySelector("button").disabled = false;
    textarea.value = "";
  }
});
    </script>

</body>
</html>
